<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>raw lite — DNG editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="file-browser">
        <header class="file-browser-header">
          <button id="file-browser-toggle" class="icon-button" type="button" title="Hide file browser" aria-expanded="true" aria-controls="folder-panel">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3" />
              <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <h2>Files</h2>
        </header>
        <div id="folder-panel"></div>
      </aside>

      <main id="viewport">
        <canvas id="view"></canvas>
        <div id="drop-overlay">
          <p><strong>Drop a DNG file</strong></p>
          <p>or use “Open RAW…” in the panel</p>
        </div>
      </main>

      <aside id="sidebar">
        <header>
          <h1>raw lite</h1>
          <label class="file-button">
            Open RAW…
            <input id="file-input" type="file" accept=".dng,.DNG" hidden />
          </label>
          <p id="status">No image loaded</p>
        </header>

        <section>
          <h2>Develop</h2>
          <div id="sliders"></div>
        </section>

        <section>
          <h2>Presets</h2>
          <div id="preset-panel"></div>
        </section>

        <section>
          <h2>Color mixer</h2>
          <div id="color-mixer-panel"></div>
        </section>

        <section>
          <h2>Tone curve</h2>
          <div id="curve-panel"></div>
        </section>

        <section>
          <h2>Debug</h2>
          <div id="debug-panel"></div>
        </section>

        <section>
          <h2>Export</h2>
          <div id="export-panel">
            <button id="export-jpeg">JPEG</button>
            <button id="export-png">PNG</button>
          </div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
